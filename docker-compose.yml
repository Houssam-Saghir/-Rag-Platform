version: '3.9'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      SA_PASSWORD: 'Your_strong_password123'
    ports:
      - '1433:1433'
    volumes:
      - sql_data:/var/opt/mssql

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=RagPlatformDb;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True;
      OpenAI__ApiKey: ${OpenAI__ApiKey}
    depends_on:
      - sqlserver
    ports:
      - '5000:8080'

  frontend:
    build:
      context: ./frontend/rag-platform
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - '4200:80'

volumes:
  sql_data:
